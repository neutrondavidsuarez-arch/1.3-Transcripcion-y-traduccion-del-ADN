    <script>
        const DRIVE_PDF_URL = "https://drive.google.com/file/d/17Ukf4QbVxBgE5t-kI9w7UEnYB4QzNF1I/view?usp=sharing";
        const DRIVE_VIDEO_URL = "https://drive.google.com/file/d/1o8EwHBCwCRN892qbzwBoaCiMfUlZxYNp/view?usp=sharing";

        // PRINCIPAL (Deber + Repaso) 30 preguntas
        const quizData = [
            { question: 'En las células eucariotas, la traducción ocurre en:', options: ['El núcleo', 'El citoplasma y el retículo endoplasmático rugoso', 'La membrana plasmática', 'La mitocondria exclusivamente'], answer: 'El núcleo', explanation: 'Lo que caracteriza una célula eucariota es poseer núcleo en donde se almacena todo la información genética como el ADN y ARN.  Por ello la traducción se da en el núcleo.', multi: 'OFF', maxSelect: 1 },
            { question: 'En la traducción, el codón AUG cumple la función de:', options: ['Señal de terminación Codón de inicio que codifica para metionina', 'Codón de inicio que codifica para metionina', 'Mutación sin sentido', 'Señal de replicación'], answer: 'Codón de inicio que codifica para metionina', explanation: 'El codón AUG tiene como función servir como codón de inicio marcando el principio de la síntesis de proteínas y codifica para el aminoácido metionina.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál de las siguientes combinaciones representa los codones de terminación en la traducción?', options: ['UUU, UUC, UUA', 'AUG, GUG, CUG', 'UAA, UAG, UGA', 'AAA, AAG, AAC'], answer: 'UAA, UAG, UGA', explanation: 'El UUA, UAG Y UGA son los tres nucleótidos que el ARNm no codifican ningún aminoácido y señala el final de la síntesis de proteínas al final de la traducción.', multi: 'OFF', maxSelect: 1 },
            { question: 'Sobre la traducción, identifica la afirmación incorrecta:', options: ['Requiere ARNm, ARNt y ribosomas', 'Es un proceso que ocurre después de la transcripción', 'Convierte proteínas en ARN', 'Tiene fases de iniciación, elongación y terminación'], answer: 'Convierte proteínas en ARN', explanation: 'Correcta: El ARNm lleva el código genético; El ARNt transporta los aminoácidos y los ribosomas son las estructuras donde ocurre el ensamblaje. <br> Correcta:  La transcripción es el proceso de crear ARNm a partir de ADN. La traducción sigue, utilizando ese ARNm para crear la proteína. <br> Incorrecta: Describe el proceso de manera inversa. <br> Correcta: Se divide en estas tres etapas fundamentales para garantizar la correcta síntesis de la cadena polipeptídica.', multi: 'OFF', maxSelect: 1 },
            { question: 'Completa la frase: En la transcripción, la ARN polimerasa lee la cadena molde en dirección ______ y sintetiza el ARN en dirección ______.', options: ['5’→3’ / 3’→5’', '3’→5’ / 5’→3’', '5’→3’ / 5’→3’', '3’→5’ / 3’→5’'], answer: '3’→5’ / 5’→3’', explanation: '<br> <img src="https://drive.google.com/thumbnail?id=1WJjfNnSMzXqDSdD199KPduUoDc93VBtQQ7QewOeMLW8&sz=w800-h600" width="600" height="350" alt="Descripción">.', multi: 'OFF', maxSelect: 1 },
            { question: 'En un experimento, un investigador bloquea la acción de la ARN polimerasa. ¿Qué proceso quedará directamente afectado?', options: ['Traducción', 'Transcripción', 'Replicación', 'Síntesis proteica en el ribosoma'], answer: 'Transcripción', explanation: 'La ARN polimerasa es la enzima responsable de leer la secuencia de ADN y sintetizar una molécula de ARN o también conocido como transcripción. Al bloquear la enzima, se detiene la producción de ARN a partir del ADN.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál de las siguientes moléculas se produce directamente al finalizar la transcripción?', options: ['Cadena polipeptídica', 'ARNm', 'ARNt cargado', 'Ribosoma funcional'], answer: 'ARNm', explanation: 'El ARNm es el producto directo de la transcripción porque este proceso consiste en copiar la secuencia de una porción del ADN a una molécula de ARN complementaria. <br> La enzima ARN polimerasa se encarga de realizar esta copia. El ARNm lleva el "mensaje" (la información genética) fuera del núcleo (en eucariotas) hacia los ribosomas para ser traducido en proteína.', multi: 'OFF', maxSelect: 1 },
            { question: 'En células eucariotas, después de la transcripción, el ARNm sufre modificaciones. Una de ellas es:a) Eliminación de intrones y unión de exones', options: ['Eliminación de intrones y unión de exones', 'Adición de aminoácidos', 'Cambio de uracilo a timina', 'Duplicación de la secuencia'], answer: 'Eliminación de intrones y unión de exones', explanation: 'En las células eucariotas, la transcripción produce inicialmente un transcrito primario o pre-ARNm en el núcleo. <br> Este pre-ARNm debe someterse a un proceso de maduración o procesamiento postranscripcional antes de ser exportado al citoplasma. El evento central de esta maduración es el corte y empalme (splicing), llevado a cabo por el complejo molecular llamado espliceosoma (spliceosome), el cual remueve las secuencias no codificantes (intrones) y empalma las secuencias codificantes (exones).', multi: 'OFF', maxSelect: 1 },
            { question: 'Si una mutación elimina el codón de terminación de un ARNm, lo más probable es que:', options: ['La proteína se sintetice normalmente', 'La síntesis proteica no comience', 'Se genere una proteína más larga de lo normal', 'No se transcriba el gen'], answer: 'Se genere una proteína más larga de lo normal', explanation: 'Cuando ocurre una mutación que destruye o elimina el codón de parada original (UAA, UAG o UGA) —proceso conocido como mutación sin parada o nonstop mutation—, el ribosoma no recibe la señal para reclutar los factores de liberación. En su lugar, continúa la lectura y traducción de los nucleótidos ubicados en la región 3′no traducida (3′-UTR) del ARNm hasta encontrar un nuevo codón de parada en pauta o llegar al final de la molécula, lo que añade aminoácidos adicionales al extremo C-terminal de la cadena.', multi: 'OFF', maxSelect: 1 },
            { question: 'En la traducción, la función principal del ARNt es:', options: ['Llevar aminoácidos al ribosoma según el codón correspondiente', 'Transportar el mensaje genético desde el núcleo', 'Formar la estructura del ribosoma', 'Modificar el ARNm'], answer: 'Llevar aminoácidos al ribosoma según el codón correspondiente', explanation: 'El ARN de transferencia (ARNt) actúan como molécula adaptadora en la traducción. En un extremo se une covalentemente a un aminoácido específico, mientras que en el otro extremo presenta un triplete de nucleótidos denominado anticodón, el cual se aparea por complementariedad de bases con el codón del ARNm para garantizar que se añada el aminoácido correcto a la cadena polipeptídica.', multi: 'OFF', maxSelect: 1 },
            { question: 'En un laboratorio, un investigador observa que, al añadir un inhibidor específico que bloquea el uso de ATP y GTP en una célula, la síntesis de proteínas se detiene por completo. Considerando el papel de estas moléculas en el proceso de traducción, ¿cuál es la explicación más lógica de este fenómeno?', options: ['El ADN no puede desenrollarse para ser copiado', 'El ribosoma no puede desplazarse ni los ARNt cargarse con aminoácidos', 'El ARNm no puede ser exportado del núcleo', 'El código genético no puede leerse correctamente'], answer: 'El ribosoma no puede desplazarse ni los ARNt cargarse con aminoácidos', explanation: 'El ATP se utiliza para cargar los ARNt con sus aminoácidos correspondientes y el GTP se usa para mover el ribosoma a lo largo del ARNm y para unir los aminoácidos en la cadena en crecimiento. Por tanto, si un inhibidor bloquea el uso de ATP y GTP, los ARNt no pueden cargarse y el ribosoma no puede desplazarse, lo que detiene por completo la síntesis de proteínas.', multi: 'OFF', maxSelect: 1 },
            { question: 'En un experimento, un investigador bloquea el GTP en una célula. Como resultado, la síntesis proteica se detiene. Esto ocurre porque el GTP proporciona energía para:', options: ['La replicación del ADN', 'El desplazamiento del ribosoma y la unión de factores de elongación', 'La formación del ARNm', 'La degradación de proteínas'], answer: 'El desplazamiento del ribosoma y la unión de factores de elongación', explanation: 'La síntesis de proteínas se detiene al bloquear el GTP porque esta molécula proporciona la energía necesaria para que el ribosoma se desplace a lo largo del ARNm y para que los factores de elongación funcionen correctamente durante la traducción. Sin GTP, el ribosoma no puede avanzar ni incorporar nuevos aminoácidos, por lo tanto, la proteína no puede formarse.', multi: 'OFF', maxSelect: 1 },
            { question: 'En la transcripción:', options: ['La ARN polimerasa sintetiza ARN en dirección 3’→5’', 'La timina del ADN se sustituye por uracilo en el ARN', 'El proceso ocurre en el citoplasma en eucariotas', 'La proteína se forma directamente a partir del ADN'], answer: 'La timina del ADN se sustituye por uracilo en el ARN', explanation: 'Durante la transcripción, el ARN se forma usando el ADN como molde. En este proceso, la timina (T) del ADN es reemplazada por uracilo (U) en el ARN. Por eso, cuando en el ADN hay una adenina (A), en el ARN se une un uracilo (U) en lugar de una timina.', multi: 'OFF', maxSelect: 1 },
            { question: 'Acerca de la traducción, selecciona la afirmación incorrecta:', options: ['Ocurre en los ribosomas del citoplasma', 'Necesita ARNm, ARNt y ribosomas', 'Convierte el ADN directamente en proteínas', 'Tiene fases de iniciación, elongación y terminación'], answer: 'Convierte el ADN directamente en proteínas', explanation: 'Es una afirmación biológicamente incorrecta. El ADN permanece en el núcleo en eucariotas o libre en el nucleoide en procariotas y se transcribe a ARNm antes de que ocurra la traducción.', multi: 'OFF', maxSelect: 1 },
            { question: 'Un científico observa que un ARNm tiene un codón UAA en medio de su secuencia. ¿Qué espera que suceda con la proteína sintetizada?', options: ['Se producirá normalmente', 'La proteína será más corta de lo esperado', 'Se sintetizará una proteína más larga', 'La transcripción se detendrá'], answer: 'La proteína será más corta de lo esperado', explanation: 'El triplete UAA es uno de los tres codones de parada o de terminación del código genético. Si se encuentra en medio de la secuencia codificante de una molécula de ARNm (fenómeno conocido como una mutación sin sentido o de terminación prematura), el ribosoma reconocerá esta señal antes de tiempo y finalizará el ensamblaje de la proteína, liberando una cadena polipeptídica truncada o más corta.', multi: 'OFF', maxSelect: 1 },
            { question: 'Durante la traducción, los ARNt se unen a los codones del ARNm mediante un anticodón complementario. El sitio del ribosoma por donde salen los ARNt descargados se llama ________.', options: ['Sitio A', 'Sitio P', 'Sitio E', 'Sitio R'], answer: 'Sitio E', explanation: 'Durante la traducción, el ribosoma tiene tres sitios principales: <br> Sitio A: donde entra el ARNt con su aminoácido. <br> Sitio P: donde se forma el enlace peptídico. <br> Sitio E: por donde sale el ARNt descargado después de transferir su aminoácido.', multi: 'OFF', maxSelect: 1 },
            { question: 'Relaciona cada codón de terminación con su descripción: <br> 1. UAA <br> 2. UAG <br> 3. UGA <br> a) Señal de terminación de la proteína <br> b) No codifica aminoácidos <br> c) Actúa como liberador del polipéptido', options: ['1a, 2b, 3c', '1c, 2b, 3a', '1b, 2a, 3c', '1a, 2c, 3b'], answer: '1a, 2c, 3b', explanation: '1a, 2c, 3b.', multi: 'OFF', maxSelect: 1 },
            { question: 'En procariotas:', options: ['a) La traducción ocurre solo después de que termina la transcripción', 'b) El ARNm puede ser traducido mientras aún se transcribe', 'c) Existe separación física entre núcleo y ribosomas', 'd) Los codones se leen en dirección 3’→5’'], answer: 'b) El ARNm puede ser traducido mientras aún se transcribe', explanation: 'En las células procariotas. como las bacterias, al no existir una envoltura nuclear que delimite el material genético, el ADN y los ribosomas se encuentran en el mismo compartimento celular (el citoplasma). Esto permite el fenómeno conocido como acoplamiento de la transcripción y la traducción: a medida que la ARN polimerasa va sintetizando el extremo 5′de la molécula de ARNm, los ribosomas se unen de inmediato a ella para comenzar a traducir la proteína antes de que la transcripción haya finalizado.', multi: 'OFF', maxSelect: 1 },
            { question: 'En un ARNm, se inserta una base extra al inicio del segundo codón. La proteína resultante:', options: ['No sufrirá cambios', 'Tendrá solo un aminoácido diferente', 'Cambiará todos los aminoácidos posteriores', 'Se sintetizará normalmente pero más rápido'], answer: 'Cambiará todos los aminoácidos posteriores', explanation: 'Cuando se inserta en el ARNm una base extra la proteína provoca un cambio en el marco de lectura .El ribosoma, al leer la secuencia en grupos de tres (codones), se desplaza y redefine todos los codones a partir del punto de la inserción. Esto resulta en una proteína donde todos los aminoácidos posteriores al punto de la base extra serán diferentes y a menudo la síntesis se detiene antes debido a la aparición de un codón de parada. Por lo tanto, la proteína resultante cambiará todos los aminoácidos posteriores.', multi: 'OFF', maxSelect: 1 },
            { question: 'El código genético se considera degenerado porque ________.', options: ['Un codón puede codificar varios aminoácidos', 'Varios codones pueden codificar el mismo aminoácido', 'Cada codón codifica para solo un aminoácido', 'Todos los codones son idénticos'], answer: 'Varios codones pueden codificar el mismo aminoácido', explanation: 'La degeneración (o redundancia) del código genético es la propiedad por la cual existen más codones que aminoácidos: hay 64 combinaciones posibles de tripletes de nucleótidos para codificar únicamente 20 aminoácidos estándar. Por esta razón, la mayoría de los aminoácidos están codificados por más de un codón (denominados codones sinónimos).', multi: 'OFF', maxSelect: 1 },
            { question: 'Relaciona cada tipo de ARN con su función principal en la célula: <br> 1. ARNm <br> 2. ARNt <br> 3. ARNr <br> a) Forma la estructura y función del ribosoma <br> b) Lleva la información genética del núcleo al citoplasma <br> c) Transporta aminoácidos según los codones del ARNm}', options: ['1a, 2c, 3b', '1c, 2b, 3a', '1b, 2c, 3a', '1b, 2a, 3c'], answer: '1b, 2c, 3a', explanation: '1b, 2c, 3a.', multi: 'OFF', maxSelect: 1 },
            { question: 'Cuando el ribosoma llega a un codón de terminación en el ARNm, ________.', options: ['Continúa añadiendo aminoácidos', 'Se detiene la síntesis y se libera el polipéptido', 'Cambia el marco de lectura', 'Se inicia la replicación'], answer: 'Se detiene la síntesis y se libera el polipéptido', explanation: 'Dado que no existe ningún ARNt con un anticodón capaz de aparearse con un codón de parada, una proteína llamada factor de liberación ingresa al sitio A del ribosoma. Esto cataliza la hidrólisis del enlace que une la cadena proteica al último ARNt, liberando el polipéptido recién sintetizado y provocando el desensamblaje de las subunidades ribosómicas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Un estudiante introduce un inhibidor de la ARN polimerasa en células eucariotas. ¿Qué proceso se verá afectado directamente y qué consecuencia tendrá?', options: ['Traducción; no se sintetizan proteínas', 'Transcripción; no se produce ARNm', 'Replicación; no se copia ADN', 'Transporte nuclear; el ARNm no sale del núcleo'], answer: 'Transcripción; no se produce ARNm', explanation: 'Si se introduce un inhibidor en la ARN polimerasa, se bloquea la transcripción, que es el proceso de sintetizar ARN a partir de una plantilla de ADN. Esto detiene la producción de diferentes tipos de ARN, como el ARNm, el ARNt y el ARNr, lo que a su vez impide la síntesis de proteínas, un proceso fundamental para la vida celular.', multi: 'OFF', maxSelect: 1 },
            { question: 'Durante la elongación de la traducción:', options: ['Los ARNt descargados se unen al sitio A', 'Los aminoácidos se ensamblan formando enlaces peptídicos', 'El ARNm se sintetiza a partir de ADN', 'Los intrones se eliminan del ARNm'], answer: 'Los aminoácidos se ensamblan formando enlaces peptídicos', explanation: 'Durante la elongación de la traducción es la fase de la síntesis de proteínas en la que los ribosomas leen el ARNm y añaden secuencialmente aminoácidos para construir una cadena polipeptídica.', multi: 'OFF', maxSelect: 1 },
            { question: 'Una característica de la transcripción en eucariotas es que:', options: ['Puede ocurrir simultáneamente con la traducción', 'Ocurre en el núcleo y requiere procesamiento del ARNm', 'No se forman ARNr ni ARNt', 'El ribosoma lee directamente el ADN'], answer: 'Ocurre en el núcleo y requiere procesamiento del ARNm', explanation: 'La transcripción se lleva a cabo dentro del núcleo celular. El producto inicial es un pre-ARNm que debe pasar por maduración o procesamiento postranscripcional (adición de la caperuza 5′, adición de la cola de poli-A y eliminación de intrones por splicing) antes de ser exportado al citoplasma para su traducción.', multi: 'OFF', maxSelect: 1 },
            { question: 'Durante un experimento, se observa que una proteína sintetizada en células animales carece de aminoácidos en el extremo N-terminal. Esto podría deberse a:', options: ['Un error en la replicación del ADN', 'Un codón de inicio defectuoso o mutado en el ARNm', 'La ausencia de ribosomas en el citoplasma', 'Mutaciones en el ARNr'], answer: 'Un codón de inicio defectuoso o mutado en el ARNm', explanation: 'Un codón de inicio defectuoso o mutado en el ARNm representa un defecto directo en el mensaje que guía el comienzo de la síntesis de la proteína.', multi: 'OFF', maxSelect: 1 },
            { question: 'El ribosoma está formado por ________ y proteínas ribosomales, y su función principal es catalizar la formación de ________ entre aminoácidos.', options: ['ARNm / codones', 'ARNr / enlaces peptídicos', 'ARNt / anticodones', 'ADN / enlaces fosfodiéster'], answer: 'ARNr / enlaces peptídicos', explanation: 'Los ribosomas son complejos ribonucleoproteicos formados por proteínas y ARN ribosomal (ARNr). Durante la traducción, el ARNr actúa como una ribozima (específicamente en el sitio catalítico de la subunidad mayor) encargada de formar los enlaces peptídicos que unen covalentemente los aminoácidos para construir la proteína.', multi: 'OFF', maxSelect: 1 },
            { question: 'Un estudiante inserta un codón de terminación prematuro en el ARNm de una proteína. Al traducirlo, la proteína será:', options: ['Más larga de lo normal', 'Truncada y probablemente no funcional', 'Exactamente igual a la original', 'Traducida en un marco alternativo'], answer: 'Truncada y probablemente no funcional', explanation: 'La proteína estará incompleta, ya que solo se sintetizará la porción del ARNm que precede al codón de terminación prematuro. La estructura y función de una proteína dependen de su forma tridimensional completa por lo tanto casi siempre perderá su capacidad para plegarse correctamente o interactuar con otras moléculas, volviéndose no funcional.', multi: 'OFF', maxSelect: 1 },
            { question: 'El sentido de lectura del ARNm y el sentido de síntesis de la proteína son:', options: ['ARNm 3’→5’; proteína C→N', 'ARNm 5’→3’; proteína N→C', 'ARNm 5’→3’; proteína C→N', 'ARNm 3’→5’; proteína N→C'], answer: 'ARNm 5’→3’; proteína N→C', explanation: 'Lectura del ARNm (5′→3′): El ribosoma avanza a lo largo de la cadena de ARN mensajero decodificando los triplete de nucleótidos (codones) desde el extremo 5′hacia el extremo 3′. <br> Síntesis de la proteína (𝑁→𝐶): La cadena polipeptídica se ensambla desde el extremo N-terminal (grupo amino del primer aminoácido, metionina) hacia el extremo C-terminal (grupo carboxilo del último aminoácido añadido), donde se forman los enlaces peptídicos secuenciales. <br> <img src="https://drive.google.com/thumbnail?id=1FbnFm9vkM31YAo94OKx6_JM1_x_RUeIvxy5_TcFnvNA&sz=w800-h600" width="400" height="350" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
            { question: 'Un investigador observa que, tras mutar un gen, el ARNm resultante contiene intrones que no se eliminan. Esto provoca que:', options: ['La proteína sintetizada sea funcional', 'La traducción se detenga o genere una proteína no funcional', 'La transcripción se detenga ', 'Los ribosomas funcionen más rápido '], answer: 'La traducción se detenga o genere una proteína no funcional', explanation: 'Refleja la consecuencia directa de la retención de intrones: el ribosoma encuentra codones de parada dentro del intrón deteniendo la síntesis, o traduce secuencias no deseadas que generan una proteína defectuosa.', multi: 'OFF', maxSelect: 1 }
        ];

        // Práctica 20 preguntas
        const quizDataExtra = [

                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';
            }
            return { valid: true, msg: analysisText };
        }

        function showSection(section, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            const app = document.getElementById('app');
            if (section === 'pdf') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">📄 Pizarra Virtual</h2><div class="iframe-container"><iframe src="${DRIVE_PDF_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            } else if (section === 'video') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">🎥 Video Clase</h2><div class="iframe-container"><iframe src="${DRIVE_VIDEO_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            }
        }

        function prepQuiz(mode, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            state = {
                currentMode: mode,
                view: 'quiz_home',
                studentName: '',
                studentEmail: '',
                activeQuestions: [],
                currentQuestion: 0,
                score: 0,
                selectedAnswer: null,
                isAnswerCorrect: null,
                emailStatus: null,
                emailAnalysis: null,
                emailAnalysisMsg: '',
                timeLeft: 0
            };
            render();
        }

        function startQuiz() {
            if (state.currentMode === 'deber') {
                state.activeQuestions = [...quizData];
            } else if (state.currentMode === 'evaluacion') {
                state.activeQuestions = [...quizData]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 10);
            } else if (state.currentMode === 'extra') {
                state.activeQuestions = [...quizDataExtra];
            } else if (state.currentMode === 'evaluacion_final') {
                state.activeQuestions = [...quizDataEvaluacion];
            }
            state.view = 'name_input';
            state.emailAnalysis = null;
            state.emailAnalysisMsg = '';
            render();
        }

        function onEmailInput() {
            const e = document.getElementById('email-in');
            if (!e) return;
            const val = e.value.trim();
            if (val.length < 5) {
                state.emailAnalysis = null;
                state.emailAnalysisMsg = '';
                updateEmailUI();
                return;
            }
            state.emailAnalysis = 'checking';
            state.emailAnalysisMsg = 'Analizando correo…';
            updateEmailUI();
            clearTimeout(window._emailCheckTimer);
            window._emailCheckTimer = setTimeout(() => {
                const result = analyzeEmail(val);
                state.emailAnalysis = result.valid ? 'valid' : 'invalid';
                state.emailAnalysisMsg = result.msg;
                updateEmailUI();
            }, 600);
        }

        function updateEmailUI() {
            const feedback = document.getElementById('email-feedback');
            const analysis = document.getElementById('email-analysis');
            const input = document.getElementById('email-in');
            if (!feedback || !analysis || !input) return;
            if (state.emailAnalysis === 'checking') {
                feedback.innerHTML = `<span class="text-slate-500 text-sm flex items-center gap-2"><span class="dot-pulse">●</span> Verificando…</span>`;
                analysis.innerHTML = `<p class="text-xs text-slate-400 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            } else if (state.emailAnalysis === 'invalid') {
                feedback.innerHTML = `<span class="text-red-600 text-sm font-semibold">✗ Correo no válido o inexistente</span>`;
                analysis.innerHTML = `<p class="text-xs text-red-500/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-emerald-400', 'border-slate-300');
                input.classList.add('border-red-400');
            } else if (state.emailAnalysis === 'valid') {
                feedback.innerHTML = `<span class="text-emerald-600 text-sm font-semibold">✓ Correo aceptado</span>`;
                analysis.innerHTML = `<p class="text-xs text-emerald-600/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-slate-300');
                input.classList.add('border-emerald-400');
            } else {
                feedback.innerHTML = '';
                analysis.innerHTML = '';
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            }
        }

        function validaDatos() {
            const n = document.getElementById('name-in').value.trim();
            const e = document.getElementById('email-in').value.trim();
            if (n.length <= 2) {
                alert("Ingresa nombre completo (mínimo 3 caracteres).");
                return;
            }
            const result = analyzeEmail(e);
            state.emailAnalysis = result.valid ? 'valid' : 'invalid';
            state.emailAnalysisMsg = result.msg;
            updateEmailUI();
            if (!result.valid) return;
            state.studentName = n;
            state.studentEmail = e;
            state.view = 'playing';
            if (state.currentMode === 'evaluacion_final') {
                startTimer();
            }
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getTimerPhaseClass(remaining) {
            for (const phase of EVAL_TIMER_PHASES) {
                if (remaining >= phase.minSeconds) {
                    return phase.colorClass;
                }
            }
            return EVAL_TIMER_PHASES[EVAL_TIMER_PHASES.length - 1].colorClass;
        }

        function startTimer() {
            stopTimer();
            state.timeLeft = EVAL_TIMER_SECONDS;
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    stopTimer();
                    state.view = 'results';
                    render();
                    enviarCorreo();
                    return;
                }
                const timerEl = document.getElementById('eval-timer');
                if (timerEl) {
                    timerEl.textContent = formatTime(state.timeLeft);
                    timerEl.className = `px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function handleAnswer(idx) {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            const option = currentQ.options[idx];

            if (isMultiQuestion(currentQ)) {
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const pos = selected.indexOf(option);
                if (pos > -1) {
                    selected.splice(pos, 1);
                } else {
                    if (selected.length >= currentQ.maxSelect) return;
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;
            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;
            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);
            if (state.isAnswerCorrect) state.score++;
            render();
            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                stopTimer();
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

        function enviarCorreo() {
            if (!state.studentEmail) return;
            state.emailStatus = 'sending';
            render();
            const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
            const totalQ = state.activeQuestions.length;
            let imageUrl = '';
            let mensaje = '';
            if (scorePerc >= 90) {
                imageUrl = 'https://img.icons8.com/color/128/medal2.png';
                mensaje = `¡Excelente trabajo, ${state.studentName}! Obtuviste un resultado sobresaliente.`;
            } else if (scorePerc >= 70) {
                imageUrl = 'https://img.icons8.com/color/128/diploma.png';
                mensaje = `¡Muy bien, ${state.studentName}! Has aprobado con un buen resultado.`;
            } else if (scorePerc >= 50) {
                imageUrl = 'https://img.icons8.com/color/128/ok.png';
                mensaje = `Buen esfuerzo, ${state.studentName}. Sigue practicando para mejorar.`;
            } else {
                imageUrl = 'https://img.icons8.com/color/128/error.png';
                mensaje = `Ánimo, ${state.studentName}. Revisa el material y vuelve a intentarlo.`;
            }
            const params = {
                to_name: state.studentName,
                to_email: state.studentEmail,
                score: scorePerc,
                correct_answers: state.score,
                total_questions: totalQ,
                mode_name: state.currentMode.toUpperCase(),
                image_url: imageUrl,
                mensaje: mensaje,
                fecha: new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
            };
            emailjs.send("service_dhvsi72", "template_cy74x9h", params)
                .then(() => {
                    state.emailStatus = 'success';
                    render();
                })
                .catch((err) => {
                    console.error('Error EmailJS:', err);
                    state.emailStatus = 'error';
                    render();
                });
        }

        function render() {
            const app = document.getElementById('app');
           
            let modeTitle = '';
            let modeDesc = '';
            if (state.currentMode === 'deber') {
                modeTitle = '🧪 Deber';
                modeDesc = 'Resuelve las 30 preguntas del banco en orden.';
            } else if (state.currentMode === 'evaluacion') {
                modeTitle = '📝 Repaso';
                modeDesc = 'Prueba de 10 preguntas seleccionadas al azar.';
            } else if (state.currentMode === 'extra') {
                modeTitle = '📚 Práctica';
                modeDesc = 'Resuelve las 20 preguntas de práctica.';
            } else if (state.currentMode === 'evaluacion_final') {
                modeTitle = '📊 Evaluación';
                modeDesc = 'Resuelve las 16 preguntas de la Evaluación (tiempo límite: 16 min).';
            }
           
            if (state.view === 'quiz_home') {
                app.innerHTML = `
                <div class="text-center py-16 animate-fade-in bg-white rounded-[3rem] shadow-xl border">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${modeTitle}</h2>
                    <p class="text-slate-500 mb-8 text-lg">${modeDesc}</p>
                    <button onclick="startQuiz()" class="bg-emerald-600 text-white px-12 py-5 rounded-2xl font-black text-xl hover:bg-emerald-700 transition-all">
                        INICIAR
                    </button>
                </div>`;
            }

            if (state.view === 'name_input') {
                app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl animate-fade-in">
                    <h2 class="text-2xl font-black mb-6 text-center">Registro de Estudiante</h2>
                    <input id="name-in" type="text" placeholder="Nombre y Apellido completo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:border-emerald-500 outline-none">
                   
                    <div class="relative mb-1">
                        <input id="email-in" type="email" placeholder="Correo para recibir nota (Gmail, Hotmail…)"
                               class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none transition-colors"
                               oninput="onEmailInput()" onblur="onEmailInput()">
                    </div>
                   
                    <div id="email-feedback" class="min-h-[22px] mb-1"></div>
                    <div id="email-analysis" class="mb-5"></div>
                   
                    <button onclick="validaDatos()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all">
                        ENTRAR AL TEST
                    </button>
                    <p class="text-center text-[11px] text-slate-400 mt-4">Se verifica formato y se descartan correos temporales. No se envía nada hasta terminar el test.</p>
                </div>`;
                setTimeout(updateEmailUI, 50);
            }

            if (state.view === 'playing') {
                const q = state.activeQuestions[state.currentQuestion];
                const progress = ((state.currentQuestion + 1) / state.activeQuestions.length) * 100;
                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige ${q.maxSelect} respuesta${q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                const timerHtml = (state.currentMode === 'evaluacion_final')
                    ? `<div id="eval-timer" class="px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}">
                           ${formatTime(state.timeLeft)}
                       </div>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4 gap-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="flex-1 max-w-xs bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                        ${timerHtml}
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map((opt, idx) => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        if (opt === q.answer) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        }
                                    }
                                } else if (isSelected) {
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                return `<button onclick="handleAnswer(${idx})" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (${selected.length}/${q.maxSelect})
                            </button>
                        ` : ''}

                        ${state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                        ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button>
                    <p class="mt-6 text-xs font-bold text-slate-400">
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' :
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' :
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }
        render();
    </script>
</body>
</html>
